
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/health.php;
    }

    location = /db-health.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/db-health.php;
    }
    location = /profile.php {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/profile.php;
    }
    location = /admin-login.php {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/admin-login.php;
   }
   location = /admin-check.php {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/admin-check.php;
    }

location = /admin-logout.php {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/admin-logout.php;
    }
    location = /admin-session.php {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/admin-session.php;
}
     location = /admin-projects.php {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/admin-projects.php;
}
location = /public-projects.php {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public-projects.php;
}
    location ~ \.(php|env)$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
